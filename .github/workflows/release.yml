name: Build Release

# Publishing a vX.Y.Z tag builds the release zip with build.sh and attaches it
# to the GitHub release. Updaters install the asset whose name starts with the
# plugin folder, so the zip is wp-fix-plugin-does-not-exist-notices-X.Y.Z.zip.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the plugin version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          header="$(sed -n 's/^ \* Version:[[:space:]]*//p' wp-fix-plugin-does-not-exist-notices.php | tr -d '[:space:]')"
          if [ "$tag" != "$header" ]; then
            echo "Tag v$tag does not match Version: $header" >&2
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: ./build.sh

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ steps.version.outputs.VERSION }}
          files: wp-fix-plugin-does-not-exist-notices-${{ steps.version.outputs.VERSION }}.zip
          body: |
            See [CHANGELOG.md](https://github.com/wpallstars/wp-fix-plugin-does-not-exist-notices/blob/main/CHANGELOG.md) for details.
